# Configuración común a todos los perfiles (dev, e2e, prod).
# Los valores sensibles se leen SIEMPRE de variables de entorno (ver .env.example); nunca se escriben aquí.

spring:
  application:
    name: jobpilot
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    locations: classpath:db/migration   # dev añade classpath:db/seed
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # el esquema solo lo cambia Flyway
  mvc:
    log-request-details: false    # nunca registrar cuerpos ni parámetros: hay CVs con datos personales
  servlet:
    multipart:                    # CV en PDF (JP-BE-04): más de 5 MB → 400 validation-error en file
      max-file-size: 5MB
      max-request-size: 6MB       # el fichero más las cabeceras de la parte multipart
      file-size-threshold: 6MB    # por debajo se queda en memoria: el CV nunca se escribe en disco
  ai:
    # spring.ai.model.chat lo fija LlmModeEnvironmentPostProcessor a partir de llm.mode: no se configura aquí.
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}        # obligatoria solo con LLM_MODE=real
      timeout: 60s                          # se supera → 504 llm-timeout
      max-retries: 0                        # sin reintentos de red: el único reintento es el de respuesta no válida
      chat:
        model: ${ANTHROPIC_MODEL:}          # vacío → claude-sonnet-5-5 (LlmModeEnvironmentPostProcessor)
        max-tokens: 4096

server:
  # La IP del cliente sale de X-Forwarded-For solo si la petición llega de un proxy interno (nginx en la red de
  # Docker: server.tomcat.remoteip.internal-proxies, por defecto 10/8, 172.16/12, 192.168/16, 127/8...). Desde
  # cualquier otra IP la cabecera se ignora, así que un cliente no puede falsearla. La usa el límite de login.
  forward-headers-strategy: native
  error:                          # el manejo de errores real está en GlobalExceptionHandler
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

# IA (JP-BE-03). fake: respuestas fijas de fake-llm/*.json, sin API key · real: Claude a través de Spring AI.
llm:
  mode: ${LLM_MODE:fake}
  max-concurrent-calls: 3               # llamadas simultáneas al LLM (sección 2.5)
  busy-retry-after-seconds: 10          # Retry-After del 503 cuando no hay hueco
  provider-retry-after-seconds: 30      # Retry-After del 503 cuando Anthropic está saturado y no indica uno

jobpilot:
  security:
    jwt:
      secret: ${JWT_SECRET}                              # sin valor por defecto en ningún perfil
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}   # lista separada por comas
  # Límites de uso (sección 2.5, JP-BE-05). Recarga progresiva: 30/h = una petición nueva cada 2 minutos.
  rate-limit:
    ai:                     # por usuario, compartido por todos los endpoints que llaman al LLM
      capacity: 30
      period: 1h
    login:                  # por IP + email en POST /auth/login
      capacity: 10
      period: 1m
    max-keys: 10000         # al llegar aquí se olvidan las claves con el cupo lleno (memoria acotada)
  # Texto del CV subido con POST /profile/cv hasta que el usuario guarda el perfil con PUT /profile (JP-BE-04).
  cv-draft:
    ttl: 30m
    max-entries: 1000       # memoria acotada: como mucho ~50.000 caracteres por borrador

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
