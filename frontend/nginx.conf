# nginx del frontend (JP-OPS-01): sirve el build de Vite y reenvía /api al backend, de modo que el navegador
# solo habla con un origen (sin CORS), igual que el proxy de Vite en desarrollo.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # ---- Cabeceras de seguridad ----
    # Van solo a nivel de server: un add_header dentro de un location anularía todas estas (herencia de nginx).
    # Por eso las cachés de los location se controlan con "expires" y no con add_header.
    #
    # CSP:
    #  · script-src 'self' estricto: solo los bundles propios, sin scripts en línea ni eval. Es la mitigación
    #    principal del JWT en localStorage (readme, 2.6): un XSS no puede cargar ni inyectar código.
    #  · style-src 'self' 'unsafe-inline': dnd-kit (tablero kanban, JP-FE-06) mueve las tarjetas con estilos en
    #    línea (style="transform: …"). Permitir estilos en línea no permite ejecutar código; el riesgo que queda
    #    (inyección de CSS) es mucho menor.
    #  · connect-src 'self': la API va por la ruta relativa /api/v1.
    #  · img-src incluye data: y blob: para iconos en línea y vistas previas generadas en el navegador.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- API → backend ----
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Límite de login por IP (JP-BE-05). Se sustituye, no se añade ($proxy_add_x_forwarded_for): nginx es el único
        # proxy, y así un X-Forwarded-For enviado por el cliente nunca llega al backend.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;      # CV en PDF de hasta 5 MB (sección 2.5) + cabeceras multipart
        proxy_read_timeout 90s;       # el backend corta las llamadas al LLM a los 60 s (→ 504)
    }

    # ---- Estáticos con hash en el nombre: caché larga. Si no existen, 404 (no el index.html). ----
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    # El index.html no se cachea, para que cada despliegue cargue los bundles nuevos.
    location = /index.html {
        expires -1;
    }

    # ---- Rutas de React Router (/login, /offers/…): fallback a la SPA ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
